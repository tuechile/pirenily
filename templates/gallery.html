{% extends "layout.html" %}

{# Shared masonry photo gallery. Each page is configured in GALLERIES (app.py). #}

{% block title %}| {{ section }}{% endblock %}
{% block extra_css %}
<link href="/static/css/body.css?v={{ asset_v }}" rel="stylesheet">
{% endblock %}

{% block content %}
<script src="{{ url_for('static', filename='clickimage.js') }}?v={{ asset_v }}"></script>

<div class="masonry{% if natural_height %} masonry--natural{% endif %}">
    {% for filename in gallery_images(folder, sort=sort) %}
    <div class="item">
        <a href="{{ img(folder, filename, original=True) }}" class="lightbox">
            <img src="{{ img(folder, filename) }}" alt="{{ filename.rsplit('.', 1)[0] }}" loading="lazy">
        </a>
    </div>
    {% endfor %}
</div>

{% endblock %}

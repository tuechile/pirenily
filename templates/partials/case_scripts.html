<!-- Shared by the Design case studies: progress bar, section rail, lightbox -->
<div class="lightbox-overlay" id="lightbox">
    <div class="close-btn" id="lightboxClose">&times;</div>
    <img id="lightboxImg" src="" alt="Expanded image">
</div>

<script>
    (function () {
        const bar = document.getElementById("progressBar");
        function onScroll() {
            const doc = document.documentElement;
            const scrollHeight = doc.scrollHeight - doc.clientHeight;
            const pct = scrollHeight > 0 ? (doc.scrollTop / scrollHeight) * 100 : 0;
            bar.style.width = pct.toFixed(2) + "%";
        }
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
    })();

    // Left rail: number every headed section, list it, and mark the one being read
    (function () {
        const list = document.getElementById("csIndex");
        const shell = document.querySelector(".cs-shell");
        const railTop = shell.getBoundingClientRect().top + window.scrollY + parseFloat(getComputedStyle(shell).paddingTop);
        shell.style.setProperty("--rail-top", railTop + "px");
        const hero = document.querySelector(".cs-hero");
        document.getElementById("csRailTitle").textContent = hero ? hero.dataset.index : "";
        const sections = [...document.querySelectorAll("[data-index]")].filter(el => el !== hero);
        const links = sections.map((sec, i) => {
            const num = String(i + 1).padStart(2, "0");
            sec.id = sec.id || sec.dataset.index.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
            const slot = sec.querySelector(".cs-num");
            if (slot) slot.textContent = num;
            const li = document.createElement("li");
            li.innerHTML = `<a href="#${sec.id}" aria-label="${num} ${sec.dataset.index}"><span class="cs-index-label">${sec.dataset.index}</span></a>`;
            list.appendChild(li);
            return li.firstChild;
        });
        const fill = document.createElement("span");
        fill.className = "cs-fill";
        list.prepend(fill);
        list.style.setProperty("--n", sections.length);

        // The fill reaches a ring as its section crosses the reading line, and slides between rings in between
        function onScroll() {
            const line = window.scrollY + window.innerHeight * 0.35;
            const tops = sections.map(sec => sec.getBoundingClientRect().top + window.scrollY);
            const centers = links.map(a => a.parentNode.offsetTop + a.offsetHeight / 2);
            let current = -1;
            tops.forEach((top, i) => { if (top <= line) current = i; });
            let y = centers[0] || 0;
            if (current >= 0 && current < sections.length - 1) {
                const t = Math.min(1, (line - tops[current]) / (tops[current + 1] - tops[current]));
                y = centers[current] + t * (centers[current + 1] - centers[current]);
            } else if (current >= 0) {
                y = centers[current];
            }
            fill.style.height = (y - (centers[0] || 0)) + "px";
            links.forEach((a, i) => {
                a.classList.toggle("is-current", i === current);
                a.classList.toggle("is-passed", i < current);
            });
        }
        window.addEventListener("resize", onScroll);
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
    })();

    (function () {
        const overlay = document.getElementById("lightbox");
        const img = document.getElementById("lightboxImg");
        function open(src, alt) {
            img.src = src;
            img.alt = alt || "Expanded image";
            overlay.style.display = "flex";
        }
        function shut() {
            overlay.style.display = "none";
            img.src = "";
        }
        document.querySelectorAll(".lightboxable").forEach(i => i.addEventListener("click", () => open(i.src, i.alt)));
        document.getElementById("lightboxClose").addEventListener("click", shut);
        overlay.addEventListener("click", (e) => { if (e.target === overlay) shut(); });
        window.addEventListener("keydown", (e) => { if (e.key === "Escape") shut(); });
    })();

    // GIF-style videos: data-rate sets the speed; loading resets playbackRate, so set it again on metadata
    document.querySelectorAll("video[data-rate]").forEach(v => {
        const rate = Number(v.dataset.rate);
        v.defaultPlaybackRate = v.playbackRate = rate;
        v.addEventListener("loadedmetadata", () => { v.playbackRate = rate; });
    });

    // Seamless strips: each card slides toward the middle by its distance from it; on touch, a
    // pinch drives the merge and lets go to whichever end is nearer (spread to pull them apart)
    document.querySelectorAll(".split-seamless").forEach(row => {
        const cards = [...row.children];
        cards.forEach((c, i) => c.style.setProperty("--k", (cards.length - 1) / 2 - i));
        let start = null;
        const spread = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
        row.addEventListener("touchstart", (e) => {
            if (e.touches.length !== 2) return;
            start = { d: spread(e.touches), m: row.classList.contains("is-merged") ? 1 : 0 };
            row.classList.add("is-pinching");
        }, { passive: true });
        row.addEventListener("touchmove", (e) => {
            if (!start || e.touches.length !== 2) return;
            e.preventDefault();
            const m = Math.min(1, Math.max(0, start.m + (start.d - spread(e.touches)) / 120));
            row.style.setProperty("--merge", m);
        }, { passive: false });
        row.addEventListener("touchend", () => {
            if (!start) return;
            const m = Number(row.style.getPropertyValue("--merge") || start.m);
            start = null;
            row.classList.remove("is-pinching");
            row.style.removeProperty("--merge");
            row.classList.toggle("is-merged", m > 0.5);
        });
    });

    // Live sites render at their desktop width and scale to fit the card
    document.querySelectorAll(".media-card--site").forEach(card => {
        const fit = () => card.style.setProperty("--site-scale", card.clientWidth / card.dataset.siteWidth);
        new ResizeObserver(fit).observe(card);
    });

    // Instagram embeds post their own height; size each frame to it so nothing is clipped
    window.addEventListener("message", (e) => {
        if (!/instagram\.com$/.test(new URL(e.origin).hostname)) return;
        let data;
        try { data = typeof e.data === "string" ? JSON.parse(e.data) : e.data; } catch (err) { return; }
        if (!data || data.type !== "MEASURE" || !data.details) return;
        document.querySelectorAll('iframe[src*="instagram.com"]').forEach(f => {
            if (f.contentWindow === e.source) {
                f.style.aspectRatio = "auto";
                f.style.height = data.details.height + "px";
            }
        });
    });
</script>
